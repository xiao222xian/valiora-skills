schema: skill-manifest/v1
id: lov-subtitle-freedom-skill
display_name: 人人字幕
display_name_en: Subtitle Freedom
version: "1.3.1"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-subtitle-freedom-skill
    persist:
      enabled: true
      namespace: skills.lov-subtitle-freedom-skill
      records_path: skills.lov-subtitle-freedom-skill.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.language
        required: false
        question: "希望使用哪种语言输出？"
      - path: user.timezone
        required: false
        question: "需要使用哪个时区处理日期和时间？"
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: "如果需要品牌身份，请提供品牌名称。"
      - path: brand.logo
        aliases:
          - identity.logo
        required: false
        question: "如果需要品牌 Logo，请提供 Logo 地址或文件路径。"
      - path: learner.english_level
        required: true
        question: "学习者的英语水平是什么？例如 CET4、A2、B1、B2 或 CET6。"
      - path: learner.native_language
        required: false
        question: "词义提示默认使用哪种语言？"
  preferences:
    namespace: lov_subtitle_freedom
    fields:
      - path: output.format
        required: false
        question: "默认同时输出干净 SRT 与带水印 ASS；是否还需要人物卡片或其他全屏艺术字？"
      - path: output.annotation_repeat
        required: false
        question: "生词释义默认只在首次出现时显示，还是重复显示？"
      - path: output.character_cards
        required: false
        default: false
        question: "是否明确开启人物艺术字幕？默认关闭，以免剧透或改变原片节奏。"
      - path: output.character_card_mode
        required: false
        default: identity_after
        question: "开启人物艺术字幕后，使用身份揭示后、首次画面只显示名字，还是首次画面完整解释？"
      - path: output.visual_style
        required: false
        default: elegant
        question: "艺术字幕使用优雅克制的风格，还是保留更醒目的经典风格？默认优雅克制。"
      - path: output.subtitle_font_size
        required: false
        default: 58
        question: "正文字幕使用默认大小，还是需要更大的阅读字号？默认 58 ASS 像素。"
      - path: output.watermark.enabled
        required: false
        default: true
        question: "是否保留品牌水印？默认开启；可手动关闭。"
      - path: output.watermark.text
        required: false
        default: "手工川工作室 Agent 字幕组"
        question: "品牌水印显示什么名称？默认是“手工川工作室 Agent 字幕组”。"
      - path: output.watermark.style
        required: false
        default: cinematic_serif
        question: "选择水印视觉风格：A 极简、B 电影衬线、C 柔和辉光、D 轻玻璃、E 署名细线、F 金色片尾。默认 B。"
      - path: output.watermark.font_size
        required: false
        default: 24
        question: "品牌水印文字使用多大字号？默认 24 ASS 像素。"
      - path: output.watermark.logo_height
        required: false
        default: 24
        question: "品牌 Logo 使用多高？默认 24 像素并保持原始比例。"
      - path: output.watermark.logo_enabled
        required: false
        default: false
        question: "是否启用品牌 Logo？默认关闭；显式开启后仍保留原图 Logo 选项。"
      - path: output.watermark.rule
        required: false
        default: true
        question: "是否保留电影衬线水印上方的水平线？默认保留。"
      - path: output.watermark.asset_mode
        required: false
        default: text_only
        question: "视频水印使用原始 Logo 位图，还是只使用文字？默认只使用文字；Logo 可单独开启。"
      - path: output.video_delivery
        required: false
        default: sidecar_only
        question: "带水印视频是否只生成外置字幕文件，不新建视频容器？默认只生成 sidecar。"
      - path: output.spoiler_policy
        required: false
        question: "人物卡默认不剧透后续剧情；是否需要放宽这个限制？"
      - path: output.evidence_fusion
        required: false
        question: "人物首次出场是否需要保留字幕、语义、联网和视频证据的分别记录？"
  interaction:
    ask_missing: true
    max_questions: 1
