  boundary: "会员权益包含本 Skill 与依赖 lov-motion-media-creator、lov-branding-consistency 的 Skill 使用权益；交付包不附带贴图、HDRI 与模型文件，会员权益不包含 GPU 与渲染时间、第三方服务费用或人工代制作"
  review_trigger: "VIP Membership 权益范围或商业模式调整时；第二部三维片交付后；lov-motion-media-creator 升主版本时"
