<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的 AI 反馈与改进</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202824;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:48px 28px}header{display:flex;justify-content:space-between;align-items:start;gap:24px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{color:#68736c;line-height:1.7}.eyebrow{color:#3a6854;font-size:12px;letter-spacing:2px}button,select,input{font:inherit;border:1px solid #d6ddd5;background:#fff;border-radius:9px;padding:11px 13px;color:inherit}button{cursor:pointer}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 20px}.filters input{flex:1;min-width:180px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:#fff;border:1px solid #e1e6df;border-radius:14px;padding:22px}.label{font-size:13px;color:#68736c}.number{font-size:30px;font-weight:650;margin:14px 0 8px}.foot{font-size:12px;color:#7c867f;line-height:1.6}section{margin-top:20px}h2{font-size:17px;margin:0 0 20px}.trend{height:160px;display:flex;align-items:flex-end;gap:6px;overflow:auto}.day{height:100%;min-width:30px;flex:1;display:flex;justify-content:flex-end;align-items:center;flex-direction:column;gap:6px}.bar{width:70%;min-width:12px;background:#36725b;border-radius:4px 4px 0 0}.day span{font-size:10px;color:#7c867f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:500;color:#68736c;white-space:nowrap}td,th{padding:14px 10px;border-bottom:1px solid #edf0eb;vertical-align:top}td.evidence{min-width:240px;max-width:400px;line-height:1.7;overflow-wrap:anywhere}.badge{border-radius:5px;background:#edf3ed;padding:4px 7px;white-space:nowrap}.negative{background:#faece6;color:#a4482d}.empty{padding:44px 16px;text-align:center;color:#68736c}summary{cursor:pointer;color:#36725b}details p{font-size:12px}.meta{font-size:11px;color:#8b948d;overflow-wrap:anywhere}footer{font-size:12px;color:#7c867f;line-height:1.8;margin:20px 0}#updated{font-size:12px}@media(max-width:700px){main{padding:26px 16px}.cards{grid-template-columns:repeat(2,1fr)}header{flex-direction:column;gap:8px}h1{font-size:26px}.card{padding:16px}.number{font-size:26px}.filters>*{flex:1}section{padding:16px}}
</style></head><body><main>
<header><div><div class="eyebrow">个人工作记录</div><h1>我的 AI 反馈与改进</h1><p>看清问题是否被解决，也留下做得好的地方。</p></div><div><button id="refresh">刷新记录</button><p id="updated"></p></div></header>
<div class="filters"><select id="project" aria-label="项目"><option value="">全部项目</option></select><select id="channel" aria-label="反馈来源"><option value="">全部来源</option><option value="explicit">明确评价</option><option value="passive">AI 推断</option></select><select id="status" aria-label="处理状态"><option value="">全部状态</option><option value="open">待处理</option><option value="verified">已验证</option><option value="declined">不采纳</option></select><select id="since" aria-label="时间范围"><option value="0">全部时间</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select><input id="search" aria-label="搜索反馈" placeholder="搜索反馈、问题类型或处理结果"></div>
<div class="cards"><div class="card"><div class="label">反馈记录</div><div class="number" id="total">0</div><div class="foot">筛选范围内的记录数量</div></div><div class="card"><div class="label">待完成闭环</div><div class="number" id="unresolved">0</div><div class="foot">完成修改后仍需验证</div></div><div class="card"><div class="label">明确评价 · 正面占比</div><div class="number" id="positive">—</div><div class="foot" id="positive-note">暂无明确评价</div></div><div class="card"><div class="label">首次验证时长 · 中位数</div><div class="number" id="median">—</div><div class="foot">按首次验证时间计算</div></div></div>
<section><h2>反馈趋势</h2><div id="trend" class="trend"></div><p class="foot" id="ratings"></p></section>
<section><h2>反馈与处理结果</h2><div class="table-wrap"><table><thead><tr><th>日期 / 项目</th><th>来源</th><th>评价</th><th>反馈证据与处理</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty">还没有反馈记录。后续明确评价或已确认的问题会显示在这里。</div></section>
<footer>明确评价与 AI 推断分开统计。正面占比只反映已记录的反馈，不代表全部任务满意度。普通需求变更不会自动算作差评。<br>数据保存在本机；记录或处理状态更新后，重新打开或刷新本页。删除请求由 AI 根据你的明确指令执行。</footer>
</main><script id="data" type="application/json">__FEEDBACK_DATA__</script><script>
const payload=JSON.parse(document.getElementById('data').textContent), all=payload.events;
const $=id=>document.getElementById(id), labels={positive:'正面',negative:'负面',mixed:'混合',neutral:'中性',captured:'待归因',triaged:'已归因','change-proposed':'待修改','change-applied':'待验证',verified:'已验证',declined:'不采纳',deferred:'暂缓'};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
for(const project of [...new Set(all.map(e=>e.project))].sort()){$('project').append(new Option(project,project));}
$('updated').textContent='更新于 '+new Date(payload.generated_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
function render(){const days=Number($('since').value), q=$('search').value.toLowerCase();const events=all.filter(e=>(!$('project').value||e.project===$('project').value)&&(!$('channel').value||e.channel===$('channel').value)&&(!$('status').value||($('status').value==='open'?!['verified','declined'].includes(e.status):e.status===$('status').value))&&(!days||Date.parse(e.ts)>=Date.now()-days*86400000)&&[e.evidence,e.kind,e.action,e.verification].join(' ').toLowerCase().includes(q));
$('total').textContent=events.length;$('unresolved').textContent=events.filter(e=>!['verified','declined'].includes(e.status)).length;
const explicit=events.filter(e=>e.channel==='explicit'),passive=events.filter(e=>e.channel==='passive');$('positive').textContent=explicit.length?Math.round(explicit.filter(e=>e.polarity==='positive').length/explicit.length*100)+'%':'—';$('positive-note').textContent=`明确评价 ${explicit.length} 条；AI 推断 ${passive.length} 条另列`;
const durations=events.filter(e=>e.first_verified).map(e=>(Date.parse(e.first_verified)-Date.parse(e.ts))/86400000).sort((a,b)=>a-b),mid=Math.floor(durations.length/2);$('median').textContent=durations.length?((durations.length%2?durations[mid]:(durations[mid-1]+durations[mid])/2)).toFixed(2)+' 天':'—';
const rated=explicit.filter(e=>e.rating!==null);$('ratings').textContent=rated.length?`用户主动评分：${(rated.reduce((s,e)=>s+e.rating,0)/rated.length).toFixed(1)} / 5（${rated.length} 条），与情绪推断分开。`:'暂无用户主动评分，不将情绪强度换算为分数。';
const counts={};for(const e of events)counts[e.local_date]=(counts[e.local_date]||0)+1;const dates=Object.keys(counts).sort(),max=Math.max(1,...Object.values(counts));$('trend').replaceChildren();if(!dates.length)$('trend').append(node('div','暂无趋势数据','empty'));for(const date of dates){const day=node('div',undefined,'day');day.append(node('span',counts[date]));const bar=node('div',undefined,'bar');bar.style.height=(counts[date]/max*115)+'px';day.append(bar,node('span',date.slice(5)));$('trend').append(day);}
$('rows').replaceChildren();$('empty').hidden=events.length>0;
for(const e of events){const row=node('tr'),date=node('td',e.local_date);date.append(node('p',e.project));row.append(date);const source=node('td',e.channel==='explicit'?'明确评价':'AI 推断');if(e.channel==='passive')source.append(node('p',`置信度 ${Math.round(e.confidence*100)}%`,'foot'));row.append(source);const polarity=node('td');polarity.append(node('span',labels[e.polarity],'badge '+e.polarity));row.append(polarity);const evidence=node('td',e.evidence,'evidence');const details=node('details'),summary=node('summary','处理记录');details.append(summary,node('p',e.action||'尚未记录处理动作'),node('p',e.verification||'尚未提供验证证据'),node('p',`事件 ${e.id} · ${e.scope}`,'meta'));evidence.append(details);row.append(evidence,node('td',labels[e.status]||e.status));$('rows').append(row);}}
for(const id of ['project','channel','status','since'])$(id).addEventListener('change',render);$('search').addEventListener('input',render);$('refresh').addEventListener('click',()=>location.reload());render();
</script></body></html>
