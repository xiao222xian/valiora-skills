schema: skill-manifest/v1
id: lov-interview-media-creator
version: "0.6.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-interview-media-creator
    persist:
      enabled: true
      namespace: skills.lov-interview-media-creator
      records_path: skills.lov-interview-media-creator.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: brand.logo
        required: false
        question: 片尾与封面用哪一个官方 Logo 文件（白色透明底版本）？
      - path: skills.lov-interview-media-creator.records.series_name
        required: false
        question: 采访短片的系列名是什么（封面底部系列条）？
      - path: skills.lov-interview-media-creator.records.chapter_card_seconds
        required: false
        question: 章节黑卡停留多少秒？
      - path: skills.lov-interview-media-creator.records.speech_speed
        required: false
        question: 对白默认加速多少（例如 1.10，保音高）？
      - path: skills.lov-interview-media-creator.records.beauty
        required: false
        question: 出镜人物要不要默认自然美颜？
      - path: skills.lov-interview-media-creator.records.fonts
        required: false
        question: 字幕与标题分别用哪款字体文件？
      - path: skills.lov-interview-media-creator.records.default_platforms
        required: false
        question: 默认发哪些平台（例如先视频号竖版，B 站横版按需）？
      - path: workspace.output_dir
        required: false
        question: 交付文件放在哪里？
  preferences:
    namespace: lov_interview_media_creator
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
