schema: skill-manifest/v1
id: lov-paper-translator
version: "0.2.1"
runtime: skill-runtime/v1
context:
  profile:
    fields: []
  preferences:
    namespace: lov_paper_translator
    fields:
    - path: user.language
      required: false
      question: 论文需要翻译成哪种语言？
    - path: user.timezone
      required: false
      question: 输出文件日期应使用哪个时区？
  interaction:
    ask_missing: false
    max_questions: 1
